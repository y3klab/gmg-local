[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmg-local"
version = "0.2.0"
description = "Local UDP client for Green Mountain Grills Wi-Fi pellet grills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Y3K Lab" }]
keywords = ["green mountain grills", "gmg", "grill", "bbq", "pellet", "smoker", "home assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/y3klab/gmg-local"
Issues = "https://github.com/y3klab/gmg-local/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gmg_local"]

[tool.hatch.build.targets.wheel.force-include]
"src/gmg_local/py.typed" = "gmg_local/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
